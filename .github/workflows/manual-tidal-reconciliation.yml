name: Manual TIDAL reconciliation tests

on:
  pull_request:
  push:
    branches:
      - feature/respect-manual-tidal-removals

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q trend_playlist_preview/app trend_playlist_preview/worker.py tests
      - name: Run offline reconciliation tests
        run: python -m unittest discover -s tests -p "test_manual*.py" -v
      - name: Run offline candidate/refill tests
        run: |
          python -m unittest discover -s tests -p "test_candidate_exclusions.py" -v
          python -m unittest discover -s tests -p "test_ranked_refill.py" -v

name: Trendee sidebar panel checks
on:
  pull_request:
    paths:
      - "custom_components/trend_playlist/**"
      - "tests/test_trendee_panel_contract.py"
      - "tests/test_playlist_snapshot.py"
      - "tests/test_trendee_playlist_contract.py"
      - "tests/test_trendee_playlist_websocket.py"
      - "trend_playlist_preview/**"
      - ".github/workflows/trendee-panel-checks.yml"
  workflow_dispatch:
jobs:
  offline-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m compileall -q custom_components/trend_playlist
      - name: JavaScript syntax
        run: node --check custom_components/trend_playlist/panel/trendee-panel.js
      - name: Read-only playlist snapshot tests
        run: python -m unittest discover -s tests -p test_playlist_snapshot.py -v
      - name: Offline playlist UI contract
        run: python -m unittest discover -s tests -p test_trendee_playlist_contract.py -v
      - name: Offline playlist WebSocket behavior
        run: python -m unittest discover -s tests -p test_trendee_playlist_websocket.py -v
      - name: Offline panel contract
        run: python -m unittest discover -s tests -p test_trendee_panel_contract.py -v
